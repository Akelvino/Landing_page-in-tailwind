<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.9.1/remixicon.min.css">
  <link href="./src/output.css" rel="stylesheet">
</head>
<body>
    <header id="header" class="sticky bg-white/90  top-0 left-0 right-0 backdrop-blure-sm border-b border-gray-100 shadow-sm z-50">
        <nav class="relative container mx-auto h-16 md:h-20 flex items-center justify-between px-4 sm:px-6 lg:px-8">
            <div class="logo flex gap-1">
                <div class="w-4 h-4 rounded-full bg-blue-700 opacity-75 hover:opacity-100 cursor-pointer"></div>
                <div class="w-4 h-4 rounded-full bg-red-500 opacity-100 hover:opacity-75 cursor-pointer -ml-2"></div>
            </div>
            <div id="nav-menu" class="absolute  left-0 top-17 w-full bg-white py-4 overflow-hidden -translate-y-full opacity-0 pointer-events-none transition-all duration-300 ease-out md:static md:w-auto md:min-h-fit md:bg-transparent md:py-0 md:overflow-visible md:translate-y-0 md:opacity-100 md:pointer-events-auto">
                <div class="flex flex-col  md:flex-row py-4 border-b border-gray-100 space-y-3 px-4">
                    <ul class="text-sm font-medium text-gray-600 flex flex-col md:flex-row md:items-center justify-center gap-8 md:mr-70">
                        <li><a class="nav_link" href="#">Home</a></li>
                        <li><a class="nav_link" href="#">About Us</a></li>
                        <li><a class="nav_link" href="#">Our Services</a></li>
                        <li><a class="nav_link" href="#">Testimonials</a></li>
                    </ul>
                    <button class="mt-10 md:mt-0 w-1/2 md:w-auto bg-blue-600 hover:bg-blue-700 cursor-pointer text-white px-6 py-2.5 rounded-lg text-sm font-medium transition-all duration-300 ease-in-out">Get in touch</button>
                </div>
            </div>
            <div  class="cursor-pointer md:hidden text-4xl">
                <i id="hamburg" class="ri-menu-line"></i>
            </div>
        </nav>
    </header>

    <section id="hero" class="mt-8">
        <div class="container mx-auto px-4 sm:px-6 lg:px-8 ">
            <div class="flex flex-col md:flex-row gap-3 justify-center">
                <div class="w-full md:w-1/2">
                    <div class="flex flex-row gap-2  group bg-gray-50 w-fit px-4 py-2 rounded-full hover:bg-gray-100 cursor-pointer transition-colors">
                        <span class="text-blue-800 group-hover:scale-110 group-hover:text-amber-300">★</span>
                        <span class="text-sm font-md">Jump start your growth</span>
                    </div>
                    <h1 class="text-3xl md:text-4xl lg:text-5xl font-bold leading-tight">
                        We boost the growth for
                        <span class="text-blue-600 relative inline-block">Startup to Fortune 500
                            <span class="absolute bottom-0 left-0 w-full h-0.5 bg-blue-200/60"></span>
                        </span>
                        <br>
                        Companies
                        <span class="inline-block ml-2 animate-pulse ">⏰</span>
                    </h1>
                    <p class="text-gray-600 text-lg md:text-xl max-w-xl">Get the most accurate leads, sales people training and conversions, tools and more — all within the same one billing</p>
                    <button class="flex gap-3 max-w-md">
                        <input type="emai" placeholder="Email address" class="flex-1 px-6 py-4 border border-gray-200 rounded-xl focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-100 transition-all text-gray-600">
                        <i class="ri-arrow-right-long-line bg-blue-600 text-white px-8 py-4 rounded-xl hover:bg-blue-700 cursor-pointer transition-all hover:shadow-lg hover:shadow-blue-300"></i>
                    </button>
                    
                </div>
                <div class="bg-red-500 w-full md:w-1/2">Right</div>
            </div>
        </div>
    </section>
    

    <script src="./js/main.js"></script>
</body>
</html>
